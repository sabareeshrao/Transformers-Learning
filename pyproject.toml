[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Day 1.1: TL-001 establish the smallest installable Python package needed for
# the transformer-learning implementation.
name = "transformers-learning"
version = "0.1.0"
description = "Hands-on reconstruction of transformer library engineering concepts"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]
